<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 680px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #kill-btn {
      background: #dc2626;
      display: none;
      margin-top: 10px;
    }
    #kill-btn:hover:not(:disabled) { background: #b91c1c; }
    #kill-btn.visible { display: block; }

    /* Output panel */
    #output-section {
      width: 100%;
      max-width: 680px;
      margin-top: 24px;
      display: none;
    }

    #output-section.visible { display: block; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    #timer {
      font-size: 0.8rem;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    .output-header span {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: none;
    }

    .status-dot.running {
      display: block;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #log {
      background: #0d1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 16px;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      max-height: 520px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line-session { color: #64748b; }
    .line-tool    { color: #38bdf8; }
    .line-text    { color: #e2e8f0; }
    .line-result  { color: #86efac; }
    .line-info    { color: #fbbf24; }
    .line-error   { color: #f87171; }
    .line-done    { color: #64748b; font-style: italic; }
  </style>
</head>
<body>
  <h1>Code Generator</h1>

  <div class="card">
    <label for="jira-key">JIRA Ticket</label>
    <input id="jira-key" type="text" placeholder="e.g. SCRUM-1" />

    <label for="repo-path">Repository Path</label>
    <input id="repo-path" type="text" placeholder="/Users/you/projects/my-repo" />

    <label for="context">Additional Context <span style="color:#4b5563;font-weight:400;text-transform:none">(optional)</span></label>
    <textarea id="context" placeholder="Any extra requirements or notes for Claude…"></textarea>

    <button id="run-btn" onclick="runGenerate()">Generate Code</button>
    <button id="kill-btn" onclick="killJob()">Kill Execution</button>
  </div>

  <div id="output-section">
    <div class="output-header">
      <span>Live Output</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="timer"></span>
        <div class="status-dot" id="status-dot"></div>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <script>
    let eventSource = null;
    let currentJobId = null;
    let isUnloading = false;
    let timerInterval = null;
    let startTime = null;

    function startTimer() {
      startTime = Date.now();
      const el = document.getElementById('timer');
      el.textContent = '0s';
      timerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - startTime) / 1000);
        el.textContent = secs >= 60
          ? `${Math.floor(secs / 60)}m ${secs % 60}s`
          : `${secs}s`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function setIdle() {
      stopTimer();
      document.getElementById('status-dot').classList.remove('running');
      document.getElementById('run-btn').disabled = false;
      document.getElementById('kill-btn').classList.remove('visible');
      document.getElementById('kill-btn').disabled = false;
      if (eventSource) { eventSource.close(); eventSource = null; }
      currentJobId = null;
    }

    async function killJob() {
      if (!currentJobId) return;
      document.getElementById('kill-btn').disabled = true;
      try {
        await fetch(`/jobs/${currentJobId}`, { method: 'DELETE' });
      } catch (_) {}
    }

    window.addEventListener('beforeunload', (e) => {
      if (!currentJobId) return;
      isUnloading = true;
      // Reset the flag after a short delay in case the user clicks "Stay"
      setTimeout(() => { isUnloading = false; }, 500);
      e.preventDefault();
      e.returnValue = '';  // triggers browser confirmation dialog
    });

    window.addEventListener('pagehide', () => {
      if (!currentJobId) return;
      // keepalive ensures the request completes even as the page unloads
      fetch(`/jobs/${currentJobId}`, { method: 'DELETE', keepalive: true }).catch(() => {});
    });

    function appendLine(text, cls) {
      const log = document.getElementById('log');
      for (const part of text.split('\n')) {
        const line = document.createElement('div');
        line.className = cls;
        line.textContent = part;
        log.appendChild(line);
      }
      log.scrollTop = log.scrollHeight;
    }

    async function runGenerate() {
      const jiraKey  = document.getElementById('jira-key').value.trim();
      const repoPath = document.getElementById('repo-path').value.trim();
      const context  = document.getElementById('context').value.trim();

      if (!jiraKey || !repoPath) {
        alert('JIRA Ticket and Repository Path are required.');
        return;
      }

      // Reset UI
      if (eventSource) { eventSource.close(); eventSource = null; }
      currentJobId = null;
      const log = document.getElementById('log');
      log.innerHTML = '';
      document.getElementById('output-section').classList.add('visible');
      document.getElementById('status-dot').classList.add('running');
      document.getElementById('run-btn').disabled = true;
      document.getElementById('kill-btn').classList.add('visible');
      startTimer();

      // Start job
      let jobId;
      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jira_key: jiraKey, repo_path: repoPath, context }),
        });
        if (!res.ok) throw new Error(await res.text());
        ({ job_id: jobId } = await res.json());
        currentJobId = jobId;
      } catch (err) {
        appendLine(`Error starting job: ${err.message}`, 'line-error');
        setIdle();
        return;
      }

      // Stream events
      eventSource = new EventSource(`/stream/${jobId}`);

      eventSource.onmessage = (e) => {
        const event = JSON.parse(e.data);
        switch (event.type) {
          case 'session': appendLine(`Session: ${event.text}`, 'line-session'); break;
          case 'tool':    appendLine(`  > ${event.text}`, 'line-tool'); break;
          case 'text':    appendLine(`Claude: ${event.text}`, 'line-text'); break;
          case 'result':  appendLine(event.text, 'line-result'); break;
          case 'info':    appendLine(event.text, 'line-info'); break;
          case 'error':   appendLine(`Error: ${event.text}`, 'line-error'); break;
          case 'done':
            appendLine('Done.', 'line-done');
            setIdle();
            break;
        }
      };

      eventSource.onerror = () => {
        if (isUnloading) return;
        appendLine('Connection lost.', 'line-error');
        setIdle();
      };
    }
  </script>
</body>
</html>
