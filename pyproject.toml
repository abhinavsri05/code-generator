[project]
name = "axis"
version = "0.1.0"
description = "AXIS — AI-eXecuted Implementation System: Claude-powered SDLC automation with JIRA and Git"
authors = [
    {name = "Abhinav"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "anyio (>=4.12.1,<5.0.0)",
    "click (>=8.0.0,<9.0.0)",
    "fastapi (>=0.110.0,<1.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "uvicorn[standard] (>=0.29.0,<1.0.0)"
]


[project.scripts]
axis = "axis.cli:main"
axis-ui = "axis.server:serve"

[tool.poetry]
packages = [{include = "axis", from = "src"}]

[tool.poetry.scripts]
axis = "axis.cli:main"
axis-ui = "axis.server:serve"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
